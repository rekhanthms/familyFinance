name: Deploy to GitHub Pages

on:
  push:
    branches: [main, Github---Pages-deployee]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        run: npm install -g npm@11.6.2

      - name: Install packages
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npx ng build --configuration pages --base-href "/${{ github.event.repository.name }}/"

      - name: Add 404 page
        run: cp dist/family-finance/browser/index.html dist/family-finance/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/family-finance/browser

      - id: deployment
        uses: actions/deploy-pages@v4
