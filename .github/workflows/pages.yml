name: Publish to GitHub Pages
on:
  push:
    branches: [main, family-finance, Github---Pages-deployee]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ci
      - name: Build (public, empty start)
        run: npx ng build --configuration pages --base-href "/${{ github.event.repository.name }}/"
      - name: Make page refreshes work
        run: cp dist/family-finance/browser/index.html dist/family-finance/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/family-finance/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
